spring:
  application:
    name: rivals-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:rivals}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

rivals:
  uploads:
    directory: ${UPLOADS_DIR:./uploads}
